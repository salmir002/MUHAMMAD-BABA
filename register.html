<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Muhammad Baba Data Sub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .register-box {
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .register-box h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #101c3a;
        }

        .register-box p {
            text-align: center;
            margin-bottom: 25px;
            color: #777;
        }

        .register-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .register-box button {
            width: 100%;
            padding: 15px;
            background: #174c91;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .register-box a {
            color: #174c91;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">MUHAMMAD BABA DATA SUB</div>
</header>

<div class="register-box">

    <h2>Create Account</h2>

    <p>Join Muhammad Baba Data Sub today</p>

    <form id="registerForm">

        <input type="text" id="name"
        placeholder="Full Name" required>

        <input type="tel" id="phone"
        placeholder="Phone Number" required>

        <input type="email" id="email"
        placeholder="Email Address" required>

        <input type="password" id="password"
        placeholder="Create Password" minlength="8" required>

        <button type="submit">Create Account</button>

    </form>

    <p style="margin-top:20px;">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <p id="message"></p>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import { getAuth, createUserWithEmailAndPassword, updateProfile }
from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import { getFirestore, doc, setDoc, serverTimestamp }
from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("registerForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.textContent = "Creating account...";

    try {
        const credential = await createUserWithEmailAndPassword(
            auth, email, password
        );

        await updateProfile(credential.user, {
            displayName: name
        });

        await setDoc(doc(db, "users", credential.user.uid), {
            name: name,
            phone: phone,
            email: email,
            walletBalance: 0,
            role: "user",
            createdAt: serverTimestamp()
        });

        message.textContent = "Account created successfully!";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {
        message.textContent = error.message;
    }
});
</script>

</body>
</html>
